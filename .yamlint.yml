extends: default
rules:
  # Разрешаем строки до 160 символов (вместо 80)
  line-length:
    max: 160
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  # Отключаем требование начинать файл с ---
  document-start: disable
  # Отключаем проверку на пустую строку в конце файла, если лень править
  new-line-at-end-of-file: disable
  # Отключаем проверку пробелов в конце строки, если лень править
  trailing-spaces: disable
